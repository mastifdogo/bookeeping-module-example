# Publishes a GitHub Release whenever the version in ledger-module.json
# changes on main. Ledger installs a module's latest release.
#
# To release: bump "version" in ledger-module.json and push to main.
name: Release

on:
  push:
    branches: [main]
    paths: [ledger-module.json]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the module
        run: |
          set -eu
          m=ledger-module.json
          jq -e . "$m" >/dev/null
          jq -e '.id | test("^[a-z][a-z0-9-]{1,31}$")' "$m" >/dev/null || { echo "::error::invalid id"; exit 1; }
          jq -e '.name | type == "string" and length > 0' "$m" >/dev/null || { echo "::error::name is required"; exit 1; }
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?$")' "$m" >/dev/null || { echo "::error::version must be x.y.z"; exit 1; }
          server=$(jq -r '.server // empty' "$m"); ui=$(jq -r '.ui // empty' "$m"); mig=$(jq -r '.migrations // empty' "$m")
          [ -z "$server" ] || [ -f "$server" ] || { echo "::error::$server is missing"; exit 1; }
          [ -z "$ui" ] || [ -f "$ui/index.html" ] || { echo "::error::$ui/index.html is missing"; exit 1; }
          [ -z "$mig" ] || [ -d "$mig" ] || { echo "::error::$mig is missing"; exit 1; }
          [ -z "$server" ] || node --check "$server"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="v$(jq -r .version ledger-module.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$(jq -r .name ledger-module.json) $tag" --generate-notes
